version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.5.3
jobs:
  cljs:
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    docker:
      - image: cimg/clojure:1.12.6-openjdk-21.0-browsers
    steps:
      - checkout
      - run: node --version
      - run: sudo corepack enable pnpm || sudo npm i -g pnpm@11.21.0
      - restore_cache:
          key: cljs-{{ checksum "deps.edn" }}-{{ checksum "pnpm-lock.yaml" }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec shadow-cljs -v compile ci-tests
      - run: ls -l target
      - browser-tools/install-chrome
      - browser-tools/install-chromedriver
      - run:
          name: Check browser tools versions
          command: |
            google-chrome --version
            chromedriver --version
            java -jar /usr/local/bin/selenium.jar --version
      - run: pnpm exec karma start --single-run
      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
            - ~/.m2
          key: cljs-{{ checksum "deps.edn" }}-{{ checksum "pnpm-lock.yaml" }}
  clj:
    docker:
      - image: cimg/clojure:1.10.3
    steps:
      - checkout
      - restore_cache:
          key: clj-{{ checksum "deps.edn" }}
      - run: clojure -A:dev:test:clj-tests
      - save_cache:
          paths:
            - ~/.m2
          key: clj-{{ checksum "deps.edn" }}
workflows:
  version: 2
  fullstack:
    jobs:
      - clj
      - cljs
